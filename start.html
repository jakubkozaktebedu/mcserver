<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PL-Mountain Serwer</title>
    <link rel="stylesheet" href="styl.css">
</head>

<body>
    <main class="main">
        <video class="tlo" autoplay muted loop playsinline>
            <source src="media.mp4" type="video/mp4">
        </video>

        <div class="hero-content">
            <div class="hero-text">
                <h1>
                    DOŁĄCZ DO NAJLEPSZEGO
                    <span>POLSKIEGO SERWERA MC</span>
                </h1>

                <p class="hero-description">
                    Obsługiwane wersje — uzupełnij wersję i wyżej
                </p>

                <a class="hero-button" href="index.html">
                    Zacznij grać
                </a>

                <p class="hero-address">
                    IP: <strong>Adres serwera</strong>
                </p>

                <p id="online_players">
                    Graczy online: —
                </p>
            </div>

            <div class="hero-logo">
                <img
                    src="Wokselowy górski serwer z pierogiem.png"
                    alt="Logo PL Mountain Server"
                >
            </div>
        </div>
    </main>
</body>
</html>
